on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to upload the APK to'
        required: true
        default: 'v1.0.1'

name: Android Build

jobs:
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
    env:
      NDK_VERSION: r27c
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf clang libclang-dev libc6-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install base packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Initialize Tauri Android project
        id: init
        continue-on-error: true
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          set -o pipefail
          pnpm tauri android init 2>&1 | tee /tmp/init.log

      - name: Patch MainActivity (Android back-button → WebView)
        run: |
          MAIN="src-tauri/gen/android/app/src/main/java/com/lvyun/app/MainActivity.kt"
          if [ ! -f "$MAIN" ]; then
            echo "MainActivity.kt not found at $MAIN, searching..."
            MAIN=$(find src-tauri/gen/android -name "MainActivity.kt" 2>/dev/null | head -1)
          fi
          if [ -z "$MAIN" ]; then
            echo "::warning::No MainActivity.kt found, skipping patch"
            exit 0
          fi
          # 动态注入：保留生成文件的 import/类声明，只在类体内加 onBackPressed 桥接，
          # 避免硬编码 TauriActivity 包名（tauri82 等版本化包名）导致 Kotlin 编译失败
          python3 - "$MAIN" << 'PYEOF'
          import sys
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          if "class MainActivity" not in src:
              print("::warning::class MainActivity not found, skip patch")
              sys.exit(0)
          if "onBackPressed" in src or "findBackWebView" in src:
              print("::warning::already patched, skip")
              sys.exit(0)
          idx = src.index("class MainActivity")
          brace = src.index("{", idx)
          inject = '''
              private var _backWebView: android.webkit.WebView? = null
          
              override fun onBackPressed() {
                  val wv = _backWebView ?: findBackWebView(window?.decorView as? android.view.ViewGroup)
                  _backWebView = wv
                  if (wv == null) {
            super.onBackPressed()
            return
                  }
                  wv.evaluateJavascript(
            "(function(){ try { return window.__onAndroidBack ? !!window.__onAndroidBack() : true; } catch(e) { return true; } })()"
                  ) { result ->
            if (result != "true") { super.onBackPressed() }
                  }
              }
          
              private fun findBackWebView(group: android.view.ViewGroup?): android.webkit.WebView? {
                  if (group == null) return null
                  for (i in 0 until group.childCount) {
            val child = group.getChildAt(i)
            if (child is android.webkit.WebView) return child
            if (child is android.view.ViewGroup) {
                val found = findBackWebView(child)
                if (found != null) return found
            }
                  }
                  return null
              }
          '''
          src = src[:brace + 1] + inject + src[brace + 1:]
          open(path, "w", encoding="utf-8").write(src)
          print(f"Patched {path} with Android back-button → WebView dispatch")
          PYEOF

      - name: Patch MainActivity (landscape + nav-bar bridge, MuHai-mirrored)
        # v2.4.3 #F：横屏真旋转整套桥——照抄幕海 V3.3.7 / V3.3.9 / V3.3.10。
        # 此前 v2.4.2 只抄了 setOrientation + onWindowFocusChanged（绑点不可靠、不自愈、不追踪实例），
        # 导致 LvYunAndroid 绑不上 -> 弹「连接中…」不真转。本版照抄幕海整套：
        #   - onWebViewCreate 官方钩子（WebView 创建瞬间 100% 存在）立即绑定；
        #   - WeakReference 实例追踪（换实例 / 被回收即重绑）；
        #   - _lvHeal 自愈循环（每 1s 自检）；
        #   - onStart / onResume / onWindowFocusChanged 多生命周期触发兜底；
        #   - setOrientation 先 _lvBind() 再发指令。
        run: |
          MAIN="src-tauri/gen/android/app/src/main/java/com/lvyun/app/MainActivity.kt"
          if [ ! -f "$MAIN" ]; then
            MAIN=$(find src-tauri/gen/android -name "MainActivity.kt" 2>/dev/null | head -1)
          fi
          if [ -z "$MAIN" ]; then
            echo "::warning::No MainActivity.kt found, skipping landscape+nav-bar patch"
            exit 0
          fi
          python3 - "$MAIN" << 'PYEOF'
          import sys
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          if "class MainActivity" not in src:
              print("::warning::class MainActivity not found, skip landscape+nav-bar patch")
              sys.exit(0)
          if "LvYunAndroid" in src:
              print("::warning::landscape+nav-bar bridge already patched, skip")
              sys.exit(0)
          idx = src.index("class MainActivity")
          brace = src.index("{", idx)
          inject = '''
              // ===== v2.4.3 #F：播放器原生桥（照抄幕海 V3.3.x 整套）=====
              private var _lvBound = false
              private var _lvBoundView: java.lang.ref.WeakReference<android.webkit.WebView>? = null
              private val _lvHealHandler = android.os.Handler(android.os.Looper.getMainLooper())
              private fun _lvBindTo(wv: android.webkit.WebView?) {
                  try {
                      if (wv == null) return
                      val prev = _lvBoundView?.get()
                      if (!_lvBound || prev !== wv) {
                          wv.addJavascriptInterface(LvYunAndroid, "LvYunAndroid")
                          _lvBoundView = java.lang.ref.WeakReference(wv)
                          _lvBound = true
                      }
                  } catch (e: Exception) { /* ignore */ }
              }
              private fun _lvBind() {
                  _lvBindTo(findBackWebView(window?.decorView as? android.view.ViewGroup))
              }
              override fun onWebViewCreate(webView: android.webkit.WebView) {
                  super.onWebViewCreate(webView)
                  _lvBindTo(webView)
                  _lvHealHandler.postDelayed({ _lvBind() }, 800)
              }
              private var _lvHealRunning = false
              private val _lvHeal = object : Runnable {
                  override fun run() {
                      var keep = true
                      try {
                          val wv = findBackWebView(window?.decorView as? android.view.ViewGroup)
                          val prev = _lvBoundView?.get()
                          if (wv == null) {
                              keep = true
                          } else if (prev == null || prev !== wv || !_lvBound) {
                              _lvBind()
                              keep = true
                          } else {
                              keep = false
                          }
                      } catch (e: Exception) {
                          keep = true
                      }
                      if (keep) {
                          _lvHealHandler.postDelayed(this, 1000)
                      } else {
                          _lvHealRunning = false
                      }
                  }
              }
              private fun _lvHealStart() {
                  if (_lvHealRunning) return
                  _lvHealRunning = true
                  _lvHealHandler.postDelayed(_lvHeal, 0)
              }
              var _lvNavColor: Int? = null
              var _lvNavLight: Boolean = false
              fun _lvApplyNavBar() {
                  val c = _lvNavColor ?: return
                  try {
                      window.navigationBarColor = c
                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          val decor = window.decorView
                          val flag = android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                          decor.systemUiVisibility =
                              if (_lvNavLight) decor.systemUiVisibility or flag
                              else decor.systemUiVisibility and flag.inv()
                      }
                  } catch (e: Exception) { /* ignore */ }
              }
              val LvYunAndroid = object {
                  @android.webkit.JavascriptInterface
                  fun isBound(): Boolean = _lvBound && _lvBoundView?.get() != null
                  @android.webkit.JavascriptInterface
                  fun setOrientation(orientation: String) {
                      runOnUiThread {
                          _lvBind()
                          try {
                              when (orientation) {
                                  "landscape" -> requestedOrientation =
                                      android.content.pm.ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                                  "sensor" -> requestedOrientation =
                                      android.content.pm.ActivityInfo.SCREEN_ORIENTATION_FULL_SENSOR
                                  else -> requestedOrientation =
                                      android.content.pm.ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                              }
                          } catch (e: Exception) { /* ignore */ }
                      }
                  }
                  @android.webkit.JavascriptInterface
                  fun setNavBarColor(color: String, lightBars: Boolean) {
                      runOnUiThread {
                          try {
                              _lvNavColor = android.graphics.Color.parseColor(color)
                              _lvNavLight = lightBars
                              _lvApplyNavBar()
                          } catch (e: Exception) { /* ignore */ }
                      }
                  }
              }
          '''
          src = src[:brace + 1] + inject + src[brace + 1:]

          bind_code = '''
                  _lvHealStart()

          '''
          if "fun onStart(" not in src:
              onstart = '''
              override fun onStart() {
                  super.onStart()
                  _lvHealStart()
              }

              '''
              src = src[:brace + 1] + onstart + src[brace + 1:]
          else:
              import re
              src = re.sub(r'(super\.onStart\(\)\s*\n)', r'\1' + bind_code, src, count=1)
          if "fun onResume(" not in src:
              onresume = '''
              override fun onResume() {
                  super.onResume()
                  _lvHealStart()
              }

              '''
              src = src[:brace + 1] + onresume + src[brace + 1:]
          else:
              import re
              src = re.sub(r'(super\.onResume\(\)\s*\n)', r'\1' + bind_code, src, count=1)
          if "fun onWindowFocusChanged(" not in src:
              onfocus = '''
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) _lvHealStart()
              }

              '''
              src = src[:brace + 1] + onfocus + src[brace + 1:]
          open(path, "w", encoding="utf-8").write(src)
          print("Patched " + path + " with LvYunAndroid landscape+nav-bar bridge (MuHai-mirrored)")
          PYEOF

      - name: Sync Android launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/sync-android-icon.py

      - name: Build Tauri Android APK
        id: build
        if: steps.init.outcome == 'success'
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          # rquickjs-sys 在 Android 目标用 bindgen 生成 FFI 绑定时，libclang 以
          # --target=aarch64-linux-android 等调用。若用宿主 glibc 头会触发
          # gnu/stubs-32.h 缺失而失败；改用 Android NDK 的 bionic sysroot 解析 C 头，
          # bionic 无 glibc 的 stubs 问题，绑定可正常生成。
          # 注意：此变量仅影响 bindgen 解析，不影响 cc 对 C 源码的实际交叉编译。
          NDK_SYSROOT=""
          for d in "$ANDROID_NDK_HOME" "$ANDROID_NDK" "$ANDROID_HOME/ndk/$NDK_VERSION" /usr/local/lib/android/ndk/*; do
            if [ -n "$d" ] && [ -d "$d/toolchains/llvm/prebuilt/linux-x86_64/sysroot" ]; then
              NDK_SYSROOT="$d/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
              break
            fi
          done
          echo "NDK_SYSROOT=$NDK_SYSROOT"
          if [ -z "$NDK_SYSROOT" ]; then
            echo "::error::NDK sysroot not found; cannot configure bindgen" && exit 1
          fi
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot $NDK_SYSROOT"
          set -o pipefail
          pnpm tauri android build --apk 2>&1 | tee /tmp/build.log

      - name: Sign APK with persisted keystore (if configured)
        id: sign
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured; skipping signing (APK stays unsigned)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.p12
          SRC=$(find src-tauri/gen/android -name '*unsigned*.apk' | head -1)
          # v2.3.10：签名产物带上版本号（lvyun-v2.3.10.apk），不再是固定的 lvyun-android.apk
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/release/${{ github.event.repository.name }}-${RELEASE_TAG}.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/keystore.p12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out "$OUT" \
            "$SRC"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$OUT"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"

      - name: Ensure release exists
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "律云 LvYun Android APK (${RELEASE_TAG})" || true

      - name: Upload APK to Release
        id: upload
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          # 优先已签名产物；未配置 keystore 时退回未签名的
          APK="${SIGNED_APK:-}"
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name '*.apk' ! -name '*unsigned*' | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name '*.apk' | head -1)
          fi
          echo "Uploading APK: $APK"
          if [ -z "$APK" ]; then
            echo "No APK found under src-tauri/gen/android"
            echo "--- outputs tree ---"
            ls -R src-tauri/gen/android/app/build/outputs 2>/dev/null || true
            exit 1
          fi
          # v2.3.10：统一重命名为「应用名-版本.apk」，保证下载到的文件名带版本号
          OUT_NAME="${{ github.event.repository.name }}-${RELEASE_TAG}.apk"
          if [ "$(basename "$APK")" != "$OUT_NAME" ]; then
            cp "$APK" "/tmp/$OUT_NAME"
            APK="/tmp/$OUT_NAME"
          fi
          gh release upload "$RELEASE_TAG" "$APK" --clobber 2>&1 | tee /tmp/upload.log
          # 清掉历史遗留的「不带版本号」资产，避免同一个 release 里挂着两个 APK 让人下错
          gh release delete-asset "$RELEASE_TAG" "${{ github.event.repository.name }}-android.apk" --yes 2>/dev/null || true

      - name: "Debug: dump logs to issue"
        if: always() && (steps.init.outcome != 'success' || steps.build.outcome != 'success' || steps.upload.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Android build debug (run ${{ github.run_id }})"
            echo "init=${{ steps.init.outcome }} build=${{ steps.build.outcome }} sign=${{ steps.sign.outcome }} upload=${{ steps.upload.outcome }}"
            echo '```'
            echo "### find apk:"; find src-tauri/gen/android -name '*.apk' 2>/dev/null || echo none
            echo "### init.log"; tail -200 /tmp/init.log 2>/dev/null
            echo "### build.log"; tail -200 /tmp/build.log 2>/dev/null
            echo "### upload.log"; tail -200 /tmp/upload.log 2>/dev/null
            echo "### gh release view"; gh release view "$RELEASE_TAG" 2>&1 || true
            echo '```'
          } | gh issue create --repo ${{ github.repository }} --title "Android debug ${{ github.run_id }}" --body-file -
